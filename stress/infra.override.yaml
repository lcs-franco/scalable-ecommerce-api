services:
  postgres:
    command: ['postgres', '-c', 'max_wal_size=16GB']
    cpus: 2
    mem_limit: 2g

  redis:
    cpus: 0.5
    mem_limit: 128m

  kafka:
    cpus: 1
    mem_limit: 1g
    environment:
      # The image's default heap (-Xmx1G) alone would fill the limit
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m

  kafka-init:
    cpus: 0.5
    mem_limit: 512m

  mailpit:
    cpus: 0.25
    mem_limit: 128m
