services:
  postgres:
    command: ['postgres', '-c', 'max_wal_size=16GB']
    cpus: 2
    mem_limit: 2g

  redis:
    cpus: 0.5
    mem_limit: 128m

  kafka:
    cpus: 1
    mem_limit: 1g
    environment:
      # The image's default heap (-Xmx1G) alone would fill the limit
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
      # Clients that bootstrap through the proxy get it back as the broker's address, so they stay behind it
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092,TOXIPROXY://0.0.0.0:29094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092},TOXIPROXY://toxiproxy:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,TOXIPROXY:PLAINTEXT

  kafka-init:
    cpus: 0.5
    mem_limit: 512m

  mailpit:
    cpus: 0.25
    mem_limit: 128m
