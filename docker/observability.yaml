# Limits keep the stack from competing with the services it measures

x-observability: &observability
  profiles: [observability]
  restart: unless-stopped

services:
  prometheus:
    <<: *observability
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      # k6 pushes its metrics here (experimental-prometheus-rw output)
      - --web.enable-remote-write-receiver
    ports:
      - ${PROMETHEUS_PORT:-9090}:9090
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    cpus: 1
    mem_limit: 1g

  grafana:
    <<: *observability
    image: grafana/grafana:12.1.0
    ports:
      - ${GRAFANA_PORT:-3100}:3000
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/platform.json
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    cpus: 0.5
    mem_limit: 256m

  loki:
    <<: *observability
    image: grafana/loki:3.5.3
    command: ['-config.file=/etc/loki/loki.yaml']
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    cpus: 0.5
    mem_limit: 512m

  alloy:
    <<: *observability
    image: grafana/alloy:v1.10.1
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:?}
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    cpus: 0.25
    mem_limit: 256m

  cadvisor:
    <<: *observability
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    command:
      - --docker_only=true
      - --housekeeping_interval=5s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      - --disable_metrics=advtcp,cpu_topology,cpuset,disk,diskIO,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    cpus: 0.5
    mem_limit: 256m

  postgres-exporter:
    <<: *observability
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:-ecommerce}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:-ecommerce_dev}
    depends_on:
      postgres: { condition: service_healthy }
    cpus: 0.25
    mem_limit: 128m

  redis-exporter:
    <<: *observability
    image: oliver006/redis_exporter:v1.74.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis: { condition: service_healthy }
    cpus: 0.25
    mem_limit: 64m

  kafka-exporter:
    <<: *observability
    image: danielqsj/kafka-exporter:v1.9.0
    command: ['--kafka.server=kafka:29092']
    depends_on:
      kafka: { condition: service_healthy }
    cpus: 0.25
    mem_limit: 128m

volumes:
  prometheus-data:
  loki-data:
  alloy-data:
