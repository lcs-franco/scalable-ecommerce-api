x-service: &service
  restart: on-failure
  healthcheck:
    test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:$$PORT/health || exit 1']
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 10s

x-seed: &seed
  command: ['node', 'dist/db/seed.js']
  restart: 'no'

x-secrets:
  jwt: &jwt-secret ${JWT_SECRET:?set JWT_SECRET in .env}
  internal: &internal-token ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env}

services:
  api-gateway:
    <<: *service
    build: { context: .., args: { SERVICE: api-gateway } }
    image: ecommerce/api-gateway
    ports:
      - 3000:3000
    environment:
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: *jwt-secret
      USER_SERVICE_URL: http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      CART_SERVICE_URL: http://cart-service:3003
      ORDER_SERVICE_URL: http://order-service:3004
      PAYMENT_SERVICE_URL: http://payment-service:3005
      RATE_LIMIT_ANONYMOUS: ${RATE_LIMIT_ANONYMOUS:-30}
      RATE_LIMIT_AUTHENTICATED: ${RATE_LIMIT_AUTHENTICATED:-100}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-10000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    depends_on:
      redis: { condition: service_healthy }
      user-service: { condition: service_healthy }
      product-service: { condition: service_healthy }
      cart-service: { condition: service_healthy }
      order-service: { condition: service_healthy }
      payment-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
      user-seed: { condition: service_completed_successfully }
      product-seed: { condition: service_completed_successfully }

  user-service:
    <<: *service
    build: &user-build { context: .., args: { SERVICE: user-service } }
    image: ecommerce/user-service
    environment: &user-env
      PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-ecommerce_dev}@postgres:5432/user_db
      KAFKA_BROKER: kafka:29092
      JWT_SECRET: *jwt-secret
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  user-seed:
    <<: *seed
    build: *user-build
    image: ecommerce/user-service
    environment:
      <<: *user-env
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    depends_on:
      user-service: { condition: service_healthy }

  product-service:
    <<: *service
    build: &product-build { context: .., args: { SERVICE: product-service } }
    image: ecommerce/product-service
    environment: &product-env
      PORT: 3002
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-ecommerce_dev}@postgres:5432/product_db
      JWT_SECRET: *jwt-secret
      INTERNAL_SERVICE_TOKEN: *internal-token
    depends_on:
      postgres: { condition: service_healthy }

  product-seed:
    <<: *seed
    build: *product-build
    image: ecommerce/product-service
    environment: *product-env
    depends_on:
      product-service: { condition: service_healthy }

  cart-service:
    <<: *service
    build: { context: .., args: { SERVICE: cart-service } }
    image: ecommerce/cart-service
    environment:
      PORT: 3003
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: *jwt-secret
      PRODUCT_SERVICE_URL: http://product-service:3002
      INTERNAL_SERVICE_TOKEN: *internal-token
    depends_on:
      redis: { condition: service_healthy }

  order-service:
    <<: *service
    build: { context: .., args: { SERVICE: order-service } }
    image: ecommerce/order-service
    environment:
      PORT: 3004
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-ecommerce_dev}@postgres:5432/order_db
      JWT_SECRET: *jwt-secret
      KAFKA_BROKER: kafka:29092
      CART_SERVICE_URL: http://cart-service:3003
      PRODUCT_SERVICE_URL: http://product-service:3002
      INTERNAL_SERVICE_TOKEN: *internal-token
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  payment-service:
    <<: *service
    build: { context: .., args: { SERVICE: payment-service } }
    image: ecommerce/payment-service
    environment:
      PORT: 3005
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-ecommerce_dev}@postgres:5432/payment_db
      JWT_SECRET: *jwt-secret
      KAFKA_BROKER: kafka:29092
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY (sk_test_...) in .env}
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  notification-service:
    <<: *service
    build: { context: .., args: { SERVICE: notification-service } }
    image: ecommerce/notification-service
    environment:
      PORT: 3006
      LOG_LEVEL: ${LOG_LEVEL:-info}
      KAFKA_BROKER: kafka:29092
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      EMAIL_FROM: ${EMAIL_FROM:-"E-commerce" <no-reply@ecommerce.local>}
    depends_on:
      redis: { condition: service_healthy }
      mailpit: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
