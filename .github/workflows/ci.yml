name: CI

on:
  pull_request:
    branches: [main]

permissions: read-all

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

  test:
    name: Test
    needs: [typecheck, build]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce_dev
          POSTGRES_DB: user_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # Boots while dependencies install. Compose requires a .env.
      - name: Start Kafka
        run: |
          cp .env.example .env
          docker compose up -d kafka

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      # kafka-init has no healthcheck, so `up --wait` would not wait for the topics.
      - name: Create Kafka topics
        run: |
          docker compose up -d --wait kafka
          docker compose run --rm kafka-init

      - name: Create test databases
        run: |
          psql -h localhost -U ecommerce -d user_db -c "CREATE DATABASE product_db;"
          psql -h localhost -U ecommerce -d user_db -c "CREATE DATABASE order_db;"
          psql -h localhost -U ecommerce -d user_db -c "CREATE DATABASE payment_db;"
        env:
          PGPASSWORD: ecommerce_dev

      - run: pnpm test
        env:
          REDIS_URL: redis://localhost:6379
          KAFKA_BROKER: localhost:9092
